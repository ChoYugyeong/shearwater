name: Runtime comparison
# minikube, K3s, Shearwater and Docker Compose on the same GitHub-hosted
# runner, one at a time, with the same app, cgroup cap and load. See
# docs/benchmarks/runtime-bench-ci.md for what the numbers mean.
#
# It is not run on every push: a full run takes about an hour, and a shared
# runner's latency moves between runs. Memory, deploy time and update errors
# are the numbers to compare; the CSV is uploaded as an artifact.
on:
  workflow_dispatch:
    inputs:
      tools:
        description: Comma separated subset of compose,k3s,minikube,shearwater
        default: compose,k3s,minikube,shearwater
      apps:
        description: App counts to measure
        default: '1,10'
      repeats:
        description: Repeats per tool (the order rotates)
        default: '3'
  # TEMPORARY: workflow_dispatch only works once this file is on the default
  # branch. Remove this trigger before merging bench-ci into main.
  push:
    branches: [bench-ci]
    paths: [.github/workflows/runtime-bench.yml, hack/bench_runtime.py, hack/benchload/**]
  schedule:
    # Mondays 03:17 UTC.
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: runtime-bench
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CGO_ENABLED: '0'
      DOCKER_VERSION: 29.10.0
      DOCKER_SHA256: 7c1ebadc65c716cdc6d35fc78759ed0e4317debf43c21dd12f066f2006999def
      COMPOSE_VERSION: v5.7.1
      COMPOSE_SHA256: af426722a8af5de812fcee30cc1c39f0639f5f723cbadefb25e5d4db054064cf
      K3S_VERSION: v1.37.2+k3s1
      K3S_SHA256: 265b3ee6a3198ef14033c63ef46cbb32370d83795199fb6d1b01f21575eddbda
      MINIKUBE_VERSION: v1.39.0
      MINIKUBE_SHA256: b738496da01be06bbaf80c688f57ce25acd3849fbb518155f3a88e03ef555aa4
      MINIKUBE_KUBERNETES: v1.37.0
      KUBECTL_VERSION: v1.36.6
      KUBECTL_SHA256: 29818b6729dc9262b692307470d0558d027725e738be5dd47c760261868a2634
    steps:
      - name: Working directories
        run: |
          echo "TOOLS_DIR=$RUNNER_TEMP/swbench-tools" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/swbench-out" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Build sw and the load generator from this commit
        run: |
          bash hack/build.sh
          go build -trimpath -o dist/benchload ./hack/benchload
          ./dist/sw version
      - name: Fetch pinned tools and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TOOLS_DIR" "$RUNNER_TEMP/swbench-dl"
          cd "$RUNNER_TEMP/swbench-dl"
          get() { curl --fail --silent --show-error --location --retry 3 -o "$1" "$2"; echo "$3  $1" | sha256sum -c -; }
          get docker.tgz "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_VERSION}.tgz" "$DOCKER_SHA256"
          tar -xzf docker.tgz
          install -m 755 docker/* "$TOOLS_DIR/"
          get docker-compose "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64" "$COMPOSE_SHA256"
          get k3s "https://github.com/k3s-io/k3s/releases/download/${K3S_VERSION/+/%2B}/k3s" "$K3S_SHA256"
          get minikube "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64" "$MINIKUBE_SHA256"
          get kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" "$KUBECTL_SHA256"
          install -m 755 docker-compose k3s minikube kubectl "$TOOLS_DIR/"
          ls -l "$TOOLS_DIR"
      - name: Runner facts
        run: |
          nproc
          free -m
          uname -r
          cat /sys/fs/cgroup/cgroup.subtree_control
      - name: Measure
        env:
          BENCH_TOOLS: ${{ inputs.tools || 'compose,k3s,minikube,shearwater' }}
          BENCH_APPS: ${{ inputs.apps || '1,10' }}
          BENCH_REPEATS: ${{ inputs.repeats || (github.event_name == 'push' && '1') || '3' }}
        run: |
          sudo --preserve-env=GITHUB_SHA,GITHUB_RUN_ID,RUNNER_NAME \
            python3 hack/bench_runtime.py run --yes --keep-going \
            --out "$OUT_DIR" --work /var/lib/swbench \
            --sw dist/sw --loadgen dist/benchload --tool-dir "$TOOLS_DIR" \
            --tools "$BENCH_TOOLS" --apps "$BENCH_APPS" --repeats "$BENCH_REPEATS" \
            --minikube-kubernetes "$MINIKUBE_KUBERNETES"
      - name: Job summary
        if: always()
        run: |
          if [ -f "$OUT_DIR/summary.md" ]; then cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          sudo chown -R "$(id -u):$(id -g)" "$OUT_DIR" || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-comparison-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
          retention-days: 90
